services:

  # ==========================================
  # MYSQL DATABASE
  # ==========================================

  mysql:
    image: mysql:8.4

    container_name: expense-mysql

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: expense_manager
      MYSQL_USER: expense_user
      MYSQL_PASSWORD: expense_password

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-prootpassword"
        ]

      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - expense-network


  # ==========================================
  # USER SERVICE
  # ==========================================

  user-service:
    build:
      context: ./services/user-service

    container_name: expense-user-service

    restart: unless-stopped

    environment:
      PORT: 3001

      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: expense_manager
      DB_USER: expense_user
      DB_PASSWORD: expense_password

    expose:
      - "3001"

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - expense-network


  # ==========================================
  # ADMIN SERVICE
  # ==========================================

  admin-service:
    build:
      context: ./services/admin-service

    container_name: expense-admin-service

    restart: unless-stopped

    environment:
      PORT: 3002

      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: expense_manager
      DB_USER: expense_user
      DB_PASSWORD: expense_password

    expose:
      - "3002"

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - expense-network


  # ==========================================
  # API GATEWAY
  # ==========================================

  api-gateway:
    build:
      context: ./services/api-gateway

    container_name: expense-api-gateway

    restart: unless-stopped

    environment:
      PORT: 3000

      USER_SERVICE_URL: http://user-service:3001
      ADMIN_SERVICE_URL: http://admin-service:3002

    ports:
      - "3000:3000"

    depends_on:
      user-service:
        condition: service_started

      admin-service:
        condition: service_started

    networks:
      - expense-network


  # ==========================================
  # USER FRONTEND
  # ==========================================

  user-ui:
    build:
      context: ./frontend/user

    container_name: expense-user-ui

    restart: unless-stopped

    ports:
      - "8080:80"

    depends_on:
      - api-gateway

    networks:
      - expense-network


  # ==========================================
  # ADMIN FRONTEND
  # ==========================================

  admin-ui:
    build:
      context: ./frontend/admin

    container_name: expense-admin-ui

    restart: unless-stopped

    ports:
      - "8081:80"

    depends_on:
      - api-gateway

    networks:
      - expense-network


# ==========================================
# VOLUMES
# ==========================================

volumes:

  mysql_data:


# ==========================================
# NETWORK
# ==========================================

networks:

  expense-network:
    driver: bridge
